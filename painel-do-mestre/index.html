<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="stage.css">
<title>Painel do mestre · O Ídolo de Pedra, Ato I</title>
<style>
  :root {
    --bg: #0c0b0a;
    --panel: #151311;
    --panel-2: #1c1916;
    --line: #2c2723;
    --text: #e9e3d7;
    --muted: #978d80;
    --red: #b8261c;
    --red-hi: #e0483a;
    --red-dim: #3a1512;
    --gold: #c9a45c;
    --ok: #6f9a5c;
    --ok-dim: #1c2a18;
    --warn: #d39a3a;
    --mono: "Courier New", Courier, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); }
  body { display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
  body.cursed { background: radial-gradient(ellipse at top, #1d0b09 0%, var(--bg) 60%); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer; transition: border-color .15s, background .15s; }
  button:hover:not(:disabled) { border-color: #4a423b; background: #24201c; }
  button:disabled { opacity: .45; cursor: default; }
  button.on { border-color: var(--gold); color: var(--gold); }
  button.on.danger, button.danger { border-color: var(--red-hi); color: var(--red-hi); }
  button.primary { background: #2a241e; border-color: var(--gold); color: #f1dfb6; }
  button.ghost { background: transparent; color: var(--muted); }
  button.big { padding: 10px 16px; font-weight: 600; }
  .danger-btn { background: var(--red); border-color: var(--red-hi); color: #fff; font-weight: 600; }
  .danger-btn:hover:not(:disabled) { background: var(--red-hi); }
  .danger-btn.small { padding: 3px 9px; font-size: 13px; }
  input, select, textarea { background: #0f0e0c; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  h2, h3 { font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }
  h2 { font-size: 15px; color: var(--gold); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h2 small { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  h3 { font-size: 13px; color: var(--muted); margin-top: 14px; }
  p { margin: 6px 0; }
  ul, ol { margin: 6px 0; padding-left: 20px; }
  li { margin: 3px 0; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: normal; }
  .muted { color: var(--muted); }
  .nowrap { white-space: nowrap; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .tag.warn { border-color: var(--warn); color: var(--warn); }
  .tag.aberta { border-color: var(--ok); color: var(--ok); }
  .tag.estragada { border-color: var(--red-hi); color: var(--red-hi); }
  .tag.danger { border-color: var(--red-hi); color: var(--red-hi); }
  .chip.warn { border-color: var(--warn); }
  .hint-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .hint-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hint-head .lock-row { margin: 0; }
  .hint-list { margin: 8px 0 0; padding: 0; list-style: none; }
  .hint-list li { margin: 6px 0; line-height: 1.45; }
  .hint-list li.hint-on { opacity: .6; }
  .ok-text { color: var(--ok); }
  .warn-text { color: var(--warn); }
  .spoiler, .secret, .spoiler-block { filter: blur(6px); transition: filter .15s; cursor: help; }
  .spoiler:hover, .spoiler:focus, .secret:hover, .secret:focus, .spoiler-block:hover, .spoiler-block:focus { filter: none; }
  .spoiler { font-family: var(--mono); font-weight: 700; color: var(--gold); }

  #topbar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #100e0c; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; margin-right: auto; }
  .brand .eyebrow { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
  .brand strong { font-family: var(--mono); font-size: 17px; letter-spacing: .04em; }
  .round { display: flex; align-items: center; gap: 8px; }
  .round-btn { width: 38px; height: 38px; font-size: 20px; padding: 0; }
  .round-num { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
  .round-num span, .chip span, .curse-chip span { font: 11px var(--mono); text-transform: uppercase; color: var(--muted); letter-spacing: .1em; }
  .round-num b { font: 700 28px/1 var(--mono); }
  .chip, .curse-chip { display: flex; flex-direction: column; align-items: center; padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; min-height: 44px; justify-content: center; }
  .chip.ok { border-color: var(--ok); }
  .chip b { font-weight: 600; }
  .curse-chip { border: 0; padding: 0; }
  .curse-chip.active { border: 1px solid var(--red-hi); padding: 4px 12px; background: var(--red-dim); animation: pulse 2.4s ease-in-out infinite; }
  .curse-chip.active b { color: #ffb4aa; font-size: 17px; }
  @keyframes pulse { 50% { box-shadow: 0 0 18px rgba(224, 72, 58, .35); } }
  .music-box { display: flex; align-items: center; gap: 6px; }
  .players-box { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted, #aaa); }
  .music.on { border-color: var(--gold); color: var(--gold); }
  .music-box input { width: 90px; padding: 0; accent-color: var(--gold); }

  #reminders { display: flex; flex-direction: column; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); max-height: 30vh; overflow: auto; }
  .rem { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-left: 3px solid var(--line); background: var(--panel); border-radius: 0 6px 6px 0; }
  .rem span { flex: 1; }
  .rem.info { border-left-color: var(--gold); }
  .rem.warn { border-left-color: var(--warn); }
  .rem.danger { border-left-color: var(--red-hi); background: var(--red-dim); }
  .rem.curse { border-left-color: var(--red-hi); background: linear-gradient(90deg, var(--red-dim), var(--panel)); font-weight: 600; }
  .rem.muted { color: var(--muted); }

  main { display: grid; grid-template-columns: minmax(330px, 380px) 1fr; min-height: 0; }
  #chars { overflow: auto; padding: 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .char { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .char.status-morto { opacity: .5; border-color: var(--red); }
  .char.status-escapou { border-color: var(--ok); }
  .char.status-inconsciente { border-style: dashed; }
  .char header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .char header img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #000; }
  .char header div { flex: 1; }
  .char h3 { margin: 0; color: var(--text); font-size: 15px; }
  .char small { color: var(--muted); font-size: 12px; }
  .char select { font-size: 13px; padding: 4px 6px; }
  .stat { display: grid; grid-template-columns: 26px 30px 1fr 30px; align-items: center; gap: 6px; margin: 5px 0; }
  .stat button { padding: 2px 0; font-weight: 700; }
  .stat-label { font: 700 12px var(--mono); color: var(--muted); }
  .bar { position: relative; height: 24px; background: #0d0c0b; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; transition: width .2s; }
  .stat.pv .bar i { background: linear-gradient(90deg, #6e1a14, #a52a1f); }
  .stat.pd .bar i { background: linear-gradient(90deg, #2c2a4a, #4b4680); }
  .bar b { position: relative; display: block; text-align: center; font: 700 13px/24px var(--mono); }
  .pending { margin: 4px 0 6px; padding: 6px 8px; background: var(--red-dim); border: 1px solid var(--red-hi); border-radius: 6px; font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pending button { padding: 2px 8px; font-size: 13px; }
  .pd-line { margin: 4px 0 6px; padding: 6px 8px; background: rgba(90, 120, 200, .12); border-left: 3px solid #6f8fd8; border-radius: 4px; font-size: 13px; line-height: 1.4; display: flex; gap: 8px; align-items: flex-start; }
  .pd-line em { font-style: normal; color: #9fb4e8; font-weight: 600; }
  .pd-line button { padding: 1px 8px; font-size: 12px; flex: none; }
  .char-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .char-actions button { font-size: 12px; padding: 4px 8px; }
  .skills { display: flex; flex-wrap: wrap; gap: 4px; }
  .skills span { font: 12px var(--mono); background: #100f0d; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
  .skills em { font-style: normal; color: var(--muted); margin-right: 4px; }
  .char details { margin-top: 8px; }
  .char summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  .start { font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
  .secret { font-size: 13px; margin: 4px 0 0; }
  .secret em { color: var(--red-hi); font-style: normal; }

  .work { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  #tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #tabs button { border-radius: 8px 8px 0 0; border-bottom: 0; background: transparent; color: var(--muted); }
  #tabs button.on { background: var(--panel); color: var(--gold); border-color: var(--line); }
  #tab { overflow: auto; padding: 14px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }

  .breakers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .breaker { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px; text-align: left; border-width: 2px; }
  .breaker b { font-family: var(--mono); font-size: 16px; }
  .breaker span { font-weight: 700; color: var(--red-hi); }
  .breaker.on span { color: var(--ok); }
  .breaker.on { border-color: var(--ok); background: var(--ok-dim); }
  .breaker small { color: var(--muted); }
  .steps { list-style: none; padding: 0; counter-reset: step; }
  .steps li { padding: 8px 0 8px 34px; border-bottom: 1px solid var(--line); position: relative; counter-increment: step; }
  .steps li::before { content: counter(step); position: absolute; left: 0; top: 8px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font: 12px var(--mono); color: var(--muted); }
  .steps li.done::before { content: "✓"; border-color: var(--ok); color: var(--ok); }
  .steps li.done b { color: var(--muted); text-decoration: line-through; }
  .steps label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .steps p { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .door-row, .lock-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .door-input { font: 700 24px var(--mono); letter-spacing: .25em; width: 190px; text-align: center; }
  .door-msg { padding: 6px 10px; background: var(--red-dim); border-radius: 6px; }
  .door-msg.ok { background: var(--ok-dim); color: #b7dba6; }
  .lock.status-aberta { border-color: #34472c; }
  .lock.status-estragada { border-color: var(--red); }
  .guess { font: 700 18px var(--mono); letter-spacing: .2em; width: 200px; }
  .ra { width: 80px; }
  .marks { display: flex; gap: 6px; flex-wrap: wrap; }
  .mark { display: flex; flex-direction: column; align-items: center; min-width: 96px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); font-weight: 700; text-align: center; }
  .mark small { font: 12px var(--mono); color: var(--muted); }
  .mark em { font-weight: 400; font-style: normal; font-size: 12px; color: var(--muted); }
  .mark.exato { border-color: var(--ok); color: var(--ok); }
  .mark.baixo, .mark.alto { border-color: var(--warn); color: var(--warn); }

  .seg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .seg-label { font-size: 13px; color: var(--muted); margin-right: 4px; }
  .hack-plan { display: grid; grid-template-columns: 1fr 260px; gap: 14px; align-items: start; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .hack-thumb { width: 100%; border-radius: 6px; border: 1px solid var(--line); filter: blur(3px) brightness(.7); }
  .hack-thumb:hover { filter: none; }
  .last-shown { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--gold); border-radius: 8px; background: #221d15; font-size: 16px; }
  .last-shown .spoiler { font-size: 18px; }
  q { color: var(--gold); }
  table.social tr.certo td:first-child { color: var(--ok); }
  table.social tr.errado td:first-child { color: var(--red-hi); text-decoration: line-through; }
  table.social button { font-size: 12px; padding: 3px 8px; }
  .curse-table tr.current td { background: var(--red-dim); color: #ffd2cb; font-weight: 600; }
  .curse-table td:first-child { font: 700 16px var(--mono); width: 70px; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .gallery figure { margin: 0; background: #100f0d; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .gallery figure.shown { border-color: #4a5a3e; }
  .gallery .thumb { padding: 0; border: 0; border-radius: 0; background: #000; aspect-ratio: 4 / 3; overflow: hidden; }
  .gallery .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .gallery .thumb:hover img { transform: scale(1.04); }
  .secret-group .thumb img { filter: blur(8px); }
  .secret-group .thumb:hover img { filter: none; }
  .gallery figcaption { padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
  .gallery figcaption span { color: var(--muted); }
  .shown-toggle { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }

  .rules dt { font: 700 13px var(--mono); color: var(--gold); margin-top: 8px; }
  .rules dd { margin: 2px 0 0; }
  .dice-out { font-family: var(--mono); color: var(--gold); }
  textarea { width: 100%; min-height: 260px; resize: vertical; line-height: 1.5; }
  .log { list-style: none; padding: 0; max-height: 420px; overflow: auto; font-size: 13px; }
  .log li { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .log li span { display: inline-block; width: 40px; font-family: var(--mono); color: var(--muted); }

  #overlay { position: fixed; inset: 0; background: #000; z-index: 50; display: grid; grid-template-rows: auto 1fr auto; }
  #overlay[hidden] { display: none; }
  #ov-top { display: flex; align-items: center; justify-content: center; padding: 10px 70px; min-height: 64px; position: relative; }
  #ov-caption { font: 22px var(--mono); color: #eee; text-align: center; }
  #ov-close { position: absolute; right: 14px; top: 12px; background: #1a1a1a; border-color: #333; color: #bbb; }
  #ov-stage { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  #ov-stage.zoom { overflow: auto; place-items: start center; }
  #ov-img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
  #ov-stage.zoom #ov-img { max-width: none; max-height: none; cursor: zoom-out; }
  #ov-timer { position: fixed; top: 12px; left: 18px; font: 700 64px/1 var(--mono); color: #fff; text-shadow: 0 0 20px #000; z-index: 2; }
  #ov-timer.warn { color: var(--red-hi); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  #ov-done { font: 700 96px var(--mono); color: var(--red-hi); letter-spacing: .1em; }
  #ov-hint { text-align: center; color: #555; font-size: 12px; padding: 6px; }
  body.ov-open { overflow: hidden; }

  .tv-chip, .srv-chip { cursor: pointer; font: inherit; color: inherit; background: transparent; }
  .tv-chip.ok { border-color: var(--ok); }
  .tv-chip b { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tv-layout { display: grid; grid-template-columns: minmax(300px, 1fr) auto; gap: 12px; align-items: start; }
  .tv-controls { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .tv-map-card { padding: 8px; position: sticky; top: 0; }
  .editor { display: flex; justify-content: center; background: #000; border-radius: 8px; }
  .editor .stage { width: min(calc(100vw - 820px), calc((100vh - 260px) * 3537 / 3750)); min-width: 320px; }
  @media (max-width: 1300px) { .tv-layout { grid-template-columns: 1fr; } .editor .stage { width: min(100%, calc(70vh * 3537 / 3750)); } }
  .editor .stage.dim > img.map { opacity: .35; }
  #gm-tokens .tk { pointer-events: auto; cursor: grab; touch-action: none; }
  #gm-tokens .tk img { pointer-events: auto; }
  #gm-tokens .tk.dragging { transition: none; cursor: grabbing; outline: 2px dashed var(--gold); outline-offset: 2px; }
  .phone-grid { display: grid; grid-template-columns: 1fr 230px; gap: 16px; align-items: start; }
  .phone-qr { width: 100%; image-rendering: pixelated; border-radius: 8px; background: #fff; }
  .phone-url { flex: 1; min-width: 200px; font-family: var(--mono); font-size: 13px; }
  .q-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .q-item { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; cursor: pointer; }
  .q-item .spoiler { grid-column: 2; font-size: 12px; }
  .q-item.ok { border-color: var(--ok); color: #b7dba6; }
  .phone-log { max-height: 300px; }
  .phone-log li span { width: 46px; }
  @media (max-width: 1250px) { .phone-grid { grid-template-columns: 1fr; } .phone-qr { max-width: 220px; } }
  .fig-actions { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
  .fig-actions button { padding: 3px 10px; font-size: 12px; }

  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; overflow: auto; }
    body { overflow: auto; }
    #chars { border-right: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .hack-plan { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header id="topbar"></header>
  <div id="reminders"></div>
  <main>
    <aside id="chars"></aside>
    <section class="work">
      <nav id="tabs"></nav>
      <div id="tab"></div>
    </section>
  </main>

  <div id="overlay" hidden>
    <div id="ov-top">
      <div id="ov-caption"></div>
      <button id="ov-close">Fechar (Esc)</button>
    </div>
    <div id="ov-stage">
      <div id="ov-timer" hidden></div>
      <img id="ov-img" alt="">
      <div id="ov-done" hidden>TEMPO!</div>
    </div>
    <div id="ov-hint">Clique na imagem pra ver no tamanho real.</div>
  </div>

  <script src="data.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="stage.js"></script>
  <script src="dicas.js"></script>
  <script src="ritmo.js"></script>
  <script src="falas-pd.js"></script>
  <script src="mesa.js"></script>
  <script src="app.js"></script>
</body>
</html>
